spring.application.name=appgpt

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/SaboresAutenticos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN DE JPA (HIBERNATE)
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# OBLIGATORIO: Evita que Spring Boot cambie "IdAbono" por "id_abono"
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# SEGURIDAD JWT (RS256 / RSA)
# ===============================
# Si se dejan vacías, se genera un par de claves RSA al arrancar la aplicación
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.expiracion-ms=3600000
jwt.expiracion-refresh-ms=604800000

# ===============================
# CORS (FRONTEND ANGULAR)
# ===============================
app.cors.allowed-origins=http://localhost:4200

# ===============================
# BLOQUEO DE CUENTA POR INTENTOS
# ===============================
app.seguridad.intentos-maximos=3
app.seguridad.bloqueo-minutos=15

# ===============================
# CRON DE ALERTAS DE INVENTARIO
# ===============================
app.alertas.cron=0 0 0 * * *

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
